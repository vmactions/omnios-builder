name: "Watch upstream"

# Track this OS upstream and land the confs for each new release,
# switching them on in conf/all.release.conf (the hand-owned build
# membership). hooks/upstream_check.py reports one version per line --
# the newest of every branch upstream still publishes -- so a run can
# land a maintenance release (FreeBSD 14.5) and a newer major (15.2) in
# the same commit, each modelled on its own branch's newest conf.
# The generation layer does the rest: landing on main makes generate.yml
# regenerate the tables / releases.json and re-render build.yml with the
# new matrix, and that commit starts the build. See base-builder/watch.py.

permissions:
  contents: write
  issues: write

on:
  schedule:
    - cron: '40 20 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.VM_TOKEN }}

      - name: Detect and land a new upstream release
        run: |
          git switch main || (git fetch --all && git checkout -b main origin/main)
          git clone https://github.com/anyvm-org/base-builder.git
          # anyvm holds coverage.allow. Without it watch.py cannot tell
          # which variants are deliberately untested, and its suggested
          # allow lines would silently always be empty. Cloned OUTSIDE the
          # repo so it never shows up in this checkout's working tree.
          git clone --depth 1 https://github.com/anyvm-org/anyvm.git \
            "${RUNNER_TEMP}/anyvm"
          python3 base-builder/watch.py \
            --allow-file "${RUNNER_TEMP}/anyvm/.github/coverage.allow" \
            --allow-out "${RUNNER_TEMP}/allow-lines.txt" \
            --landed-out "${RUNNER_TEMP}/landed.txt"

      - name: Commit and push changes
        run: |
          git config user.email "ghactions@anyvm.org"
          git config user.name "Watch.yml"
          git add conf
          if git diff --cached --quiet; then
            echo "Nothing to commit, skipping push"
          else
            # Carry the suggested coverage.allow lines in the commit
            # message: watch.py cannot push to the anyvm repo, so this
            # is where the maintainer (and sub-project B's bump bot)
            # finds out which lines the new release needs. Built in a
            # file rather than a shell string -- a multi-line "..." here
            # would take its indentation from this YAML block scalar.
            {
              echo "Add confs for the new upstream release(s)"
              # A run can land several branches at once (a maintenance
              # release published after a newer major, e.g. FreeBSD 14.5
              # beside 15.1), so name what actually landed.
              if [ -s "${RUNNER_TEMP}/landed.txt" ]; then
                echo
                echo "Landed:"
                sed 's/^/  /' "${RUNNER_TEMP}/landed.txt"
              fi
              if [ -s "${RUNNER_TEMP}/allow-lines.txt" ]; then
                echo
                echo "Suggested anyvm/.github/coverage.allow lines:"
                sed 's/^/  /' "${RUNNER_TEMP}/allow-lines.txt"
              fi
            } > "${RUNNER_TEMP}/commit-msg.txt"
            git commit -F "${RUNNER_TEMP}/commit-msg.txt"
            # Step 1/Step 2 and the version bumper push to main within
            # seconds of each other, so the ref can move between the
            # rebase and the push. Rebase and retry instead of failing.
            pushed=""
            for attempt in 1 2 3 4 5; do
              git pull --rebase --autostash
              if git push; then
                pushed=yes
                break
              fi
              echo "push rejected (attempt ${attempt}), retrying in ${attempt}s"
              sleep "${attempt}"
            done
            if [ -z "$pushed" ]; then
              echo "push still rejected after 5 attempts"
              exit 1
            fi
          fi

      # A SILENT SUCCESS is a miss too: midnightbsd 4.0.7 landed and built
      # green on 2026-08-01 and the maintainer never heard about it,
      # although the one remaining human action -- cutting the builder
      # release tag -- was now wanted. So a successful landing opens a
      # notification issue that doubles as the to-do: close it when the
      # tag is cut. One issue per version (deduped by exact title), so a
      # re-run never posts twice.
      #
      # landed.txt carries ONE LINE PER LANDED VERSION ("<action>
      # <version>"): since the detection hooks report every branch's
      # newest, one run can land a maintenance release and a new major
      # together, and each wants its own issue. The loop reads on fd 3
      # so gh can never swallow the remaining lines from stdin.
      - name: Report a landed release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          if [ ! -s "${RUNNER_TEMP}/landed.txt" ]; then
            echo "nothing landed, no notification"
            exit 0
          fi
          while read -r action version <&3; do
            [ -n "$version" ] || continue
            TITLE="upstream release landed: ${version}"
            export TITLE
            num=$(gh issue list --state open --limit 100 \
                    --json number,title \
                    --jq "[.[] | select(.title == env.TITLE)] | .[0].number // empty")
            if [ -n "$num" ]; then
              echo "issue #${num} already open for ${version}"
              continue
            fi
            {
              if [ "$action" = "refresh" ]; then
                echo "The watcher refreshed ${version}'s confs to the final"
                echo "upstream media (the RC pins are gone) and the rebuild"
                echo "has been triggered."
              else
                echo "The watcher landed conf(s) for upstream release ${version}"
                echo "and the build matrix now includes it."
              fi
              echo
              echo "Run: ${RUN_URL}"
              echo
              echo "Next step (the one remaining human action): once the"
              echo "Build workflow is green, cut a new release tag on this"
              echo "repo -- the images and releases.json upload themselves,"
              echo "and the version bump bots propagate the tag to the"
              echo "*-vm actions and anyvm the same night."
              echo
              echo "Close this issue once the tag is cut."
            } > "${RUNNER_TEMP}/landed-issue.txt"
            gh issue create --title "${TITLE}" \
              --body-file "${RUNNER_TEMP}/landed-issue.txt"
          done 3< "${RUNNER_TEMP}/landed.txt"

      # A nightly cron nobody reads is not a watcher. A failure here means
      # either the detection hook broke (upstream redesigned its page) or
      # the URL gate rejected the derived confs -- both need a human, and
      # both leave main untouched, so there is no other visible signal.
      #
      # One issue per builder, reused by exact title, and NOT commented on
      # for every subsequent failure: a watcher that stays broken for a
      # month would otherwise produce 30 notifications saying the same
      # thing. Closing the issue after a fix re-arms the report.
      - name: Report a broken watcher
        if: failure()
        env:
          # github.token, NOT VM_TOKEN: `permissions:` above only scopes
          # GITHUB_TOKEN, so issues:write buys nothing for a PAT, and
          # VM_TOKEN is scoped for pushing (contents/workflows) -- gh
          # would 403 here and the whole report would be dead while
          # looking configured. readme.yml and rerun.yml already use
          # github.token for their gh calls.
          GH_TOKEN: ${{ github.token }}
          TITLE: "upstream watcher: ${{ github.event.repository.name }}"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          num=$(gh issue list --state open --limit 100 \
                  --json number,title \
                  --jq "[.[] | select(.title == env.TITLE)] | .[0].number // empty")
          if [ -n "$num" ]; then
            echo "issue #${num} is already open for this builder"
            exit 0
          fi
          {
            echo "The upstream watcher failed."
            echo
            echo "Run: ${RUN_URL}"
            echo
            echo "Most likely nothing was written: either"
            echo "hooks/upstream_check.py could not detect a version"
            echo "(upstream page redesign, network or HTTP error), or the"
            echo "derived confs were rejected before the first write -- a"
            echo "filename gendata would refuse, a download URL that did"
            echo "not move off the template, a companion file that cannot"
            echo "be derived, or a URL that failed its HEAD check."
            echo "The commit/push step can fail too, in which case the"
            echo "confs exist on the runner but never reached main."
            echo "The run log names the exact one."
            echo
            echo "This issue is not re-posted while it stays open. Close it"
            echo "once the watcher is fixed to re-arm the report."
          } > "${RUNNER_TEMP}/issue-body.txt"
          gh issue create --title "${TITLE}" \
            --body-file "${RUNNER_TEMP}/issue-body.txt"
